# Example only: replace host, certificate and cache paths. The map and cache
# definitions belong in nginx's http context, not inside a server block.
proxy_cache_path /var/cache/nginx/dlns-cdn levels=1:2 keys_zone=dlns_cdn:20m
                 max_size=10g inactive=30d use_temp_path=off;
map "$arg_v:$uri" $cdn_skip_cache {
    default 1;
    "~^(?:[0-9a-f]{8}|[0-9a-f]{16}|[0-9a-f]{64}):" 0;
    "~^:/__site_assets/.+\.(?:[0-9a-f]{8}|[0-9a-f]{16}|[0-9a-f]{64})(\.[^/]+)?$" 0;
}

server {
    listen 80;
    server_name cdn.dlns-stats.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cdn.dlns-stats.co.uk;

    ssl_certificate /etc/letsencrypt/live/cdn.dlns-stats.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.dlns-stats.co.uk/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache dlns_cdn;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_bypass $cdn_skip_cache;
        proxy_no_cache $cdn_skip_cache;
    }
}